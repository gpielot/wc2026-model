[metadata]
name = wc2026-model
version = 0.1.0

[options]
packages = find:
package_dir =
    = .
python_requires = >=3.9
install_requires =
    pandas>=2.0
    polars>=0.20
    numpy>=1.26
    scikit-learn>=1.4
    lightgbm>=4.3
    scipy>=1.12
    pyarrow>=15.0
    requests>=2.31
    socceraction>=1.5
    kloppy>=3.14
    matplotlib>=3.8
    streamlit>=1.32
    joblib>=1.3

[options.packages.find]
where = .
include = src*
